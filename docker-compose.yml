services:
  postgres:
    image: postgres:15-alpine
    container_name: grokreq-postgres
    environment:
      POSTGRES_DB: grokreview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grokreview"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    container_name: grokreq-app
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/grokreview?sslmode=disable
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      GROK_MODEL: ${GROK_MODEL:-xai/grok-4-1-fast-reasoning}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
